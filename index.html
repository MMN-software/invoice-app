<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<title>فاکتورساز</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فاکتورساز">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{--bg1:#0a0a1a;--bg2:#131328;--accent:#8b5cf6;--accent2:#06b6d4;--glass:rgba(255,255,255,.06);--border:rgba(255,255,255,.1);--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;--success:#22c55e;--warn:#f59e0b;--info:#3b82f6}
[data-theme="light"]{--bg1:#f8fafc;--bg2:#e2e8f0;--glass:rgba(255,255,255,.75);--border:rgba(0,0,0,.08);--text:#0f172a;--muted:#64748b}
[data-accent="blue"]{--accent:#3b82f6;--accent2:#06b6d4}
[data-accent="pink"]{--accent:#ec4899;--accent2:#f43f5e}
[data-accent="green"]{--accent:#10b981;--accent2:#84cc16}
[data-accent="orange"]{--accent:#f97316;--accent2:#eab308}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Vazirmatn',system-ui,sans-serif}
html,body{min-height:100%;overflow-x:hidden}
body{background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg1) 60%);color:var(--text);padding-bottom:100px;min-height:100vh;transition:background .5s,color .3s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(600px circle at 0% 0%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 40%),radial-gradient(500px circle at 100% 100%,color-mix(in srgb,var(--accent2) 12%,transparent),transparent 40%)}
.glass{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px}
main{margin:0 10px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-size:15px;font-weight:700;margin:16px 4px 10px;display:flex;align-items:center;gap:8px}
.section-title>span:first-child{font-size:19px}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.empty-icon{font-size:44px;margin-bottom:10px;opacity:.5}

.app-header{position:sticky;top:0;z-index:50;margin:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.h-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.h-logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:20px;flex-shrink:0}
.h-info{display:flex;flex-direction:column;min-width:0}
.h-title{font-size:15px;font-weight:800}
.h-sub{font-size:10px;color:var(--muted)}
.h-actions{display:flex;gap:5px}
.icon-btn{width:36px;height:36px;border-radius:12px;border:1px solid var(--border);background:var(--glass);color:var(--text);font-size:15px;cursor:pointer;display:grid;place-items:center;transition:.2s}
.icon-btn:active{transform:scale(.9)}

.bottom-nav{position:fixed;bottom:10px;left:10px;right:10px;z-index:60;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:7px 4px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:20px}
.nav-btn{padding:7px 1px;border-radius:12px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.25s}
.nav-btn .ni{font-size:18px}
.nav-btn.active{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 25%,transparent),color-mix(in srgb,var(--accent2) 20%,transparent));color:var(--text)}
.nav-btn.active .ni{transform:scale(1.15)}

.big-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.big-stat{padding:16px;border-radius:18px;background:var(--glass);border:1px solid var(--border);position:relative;overflow:hidden}
.big-stat::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 40%,transparent),transparent 70%)}
.big-stat .bs-icon{font-size:22px;margin-bottom:6px}
.big-stat .bs-val{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;word-break:break-all}
.big-stat .bs-lbl{font-size:11px;color:var(--muted);margin-top:2px}

.chart-wrap{padding:16px;border-radius:18px;background:var(--glass);border:1px solid var(--border);margin-bottom:16px}
.chart-title{font-size:13px;font-weight:600;margin-bottom:14px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-bottom:24px;position:relative}
.chart .bar{flex:1;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:8px 8px 4px 4px;min-height:3px;position:relative;transition:.4s}
.chart .bar .lbl{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}

.invoice-card{padding:14px;margin-bottom:10px;border-radius:16px;background:var(--glass);border:1px solid var(--border);cursor:pointer;transition:.2s}
.invoice-card:active{transform:scale(.98)}
.ic-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.ic-num{font-size:11px;color:var(--muted);font-family:monospace}
.ic-buyer{font-size:15px;font-weight:700;margin-top:4px}
.ic-status{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:600;white-space:nowrap}
.ic-status.paid{background:color-mix(in srgb,var(--success) 22%,transparent);color:var(--success)}
.ic-status.pending{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.ic-status.canceled{background:color-mix(in srgb,var(--danger) 22%,transparent);color:var(--danger)}
.ic-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;margin-top:2px}
.ic-amount{font-size:15px;font-weight:800;color:var(--text)}
.ic-date{font-size:11px}

.form-card{padding:16px;border-radius:18px;background:var(--glass);border:1px solid var(--border);margin-bottom:12px}
.form-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.form-title .ft-icon{font-size:18px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:70px;resize:none;line-height:1.6}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.item-row{padding:12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--border);margin-bottom:8px}
.item-num{font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:700}
.item-grid{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:end}
.item-grid input{padding:8px 10px;font-size:13px}
.item-del{width:32px;height:32px;border-radius:10px;border:none;background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger);cursor:pointer;font-size:14px}
.item-total{font-size:12px;color:var(--muted);text-align:left;margin-top:6px}
.item-total b{color:var(--text);font-size:13px}

.totals-box{padding:14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--border);margin-top:6px}
.totals-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid var(--border)}
.totals-row:last-child{border-bottom:none;font-size:16px;font-weight:800;color:var(--accent);padding-top:12px;margin-top:4px;border-top:2px solid var(--accent)}

.add-btn{width:100%;padding:12px;border-radius:14px;border:1px dashed var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;margin-bottom:10px;transition:.2s}
.add-btn:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}

.btn{padding:12px 18px;border-radius:14px;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-ghost{background:var(--glass);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.btn-block{width:100%;margin-bottom:10px}
.btn-sm{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--glass);color:var(--text);cursor:pointer;font-family:inherit;font-size:12px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeUp .25s}
.modal{width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:22px;border-radius:22px;background:var(--bg1);border:1px solid var(--border)}
.modal h3{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions .btn{flex:1}

.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);gap:10px}
.setting-row:last-child{border-bottom:none}
.setting-row .lbl{font-size:13px}
.setting-row .sub{font-size:11px;color:var(--muted);margin-top:3px}
.theme-colors{display:flex;gap:8px;padding:10px 0;flex-wrap:wrap}
.color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.2s}
.color-dot.active{border-color:var(--text);transform:scale(1.1)}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--glass);border:1px solid var(--border);transition:.3s;border-radius:26px}
.slider:before{position:absolute;content:"";height:18px;width:18px;left:4px;bottom:3px;background:var(--muted);transition:.3s;border-radius:50%}
input:checked+.slider{background:linear-gradient(135deg,var(--accent),var(--accent2))}
input:checked+.slider:before{transform:translateX(20px);background:#fff}

.logo-upload{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:rgba(255,255,255,.03);border:1px dashed var(--border);margin-bottom:10px}
.logo-preview{width:60px;height:60px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:26px;overflow:hidden;flex-shrink:0}
.logo-preview img{width:100%;height:100%;object-fit:cover}

.template-select{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.template-card{padding:10px 6px;border-radius:12px;border:2px solid var(--border);background:var(--glass);cursor:pointer;text-align:center;transition:.2s}
.template-card.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent)}
.template-card .tc-icon{font-size:22px;margin-bottom:4px;display:block}
.template-card .tc-name{font-size:10px;font-weight:600}

.customer-card{padding:14px;margin-bottom:10px;border-radius:16px;background:var(--glass);border:1px solid var(--border);cursor:pointer}
.customer-avatar{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;flex-shrink:0}
.customer-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.customer-info{flex:1;min-width:0}
.customer-name{font-size:15px;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.customer-meta{font-size:11px;color:var(--muted)}
.customer-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--border);padding-top:10px}
.customer-stat{text-align:center}
.customer-stat .cs-val{font-size:13px;font-weight:800;color:var(--accent)}
.customer-stat .cs-lbl{font-size:9px;color:var(--muted);margin-top:2px}

.toast{padding:12px 16px;border-radius:14px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:toastIn .3s ease;pointer-events:auto;display:flex;align-items:center;gap:10px}
.toast.success{border-color:color-mix(in srgb,var(--success) 50%,transparent);background:color-mix(in srgb,var(--success) 15%,var(--bg2))}
.toast.error{border-color:color-mix(in srgb,var(--danger) 50%,transparent);background:color-mix(in srgb,var(--danger) 15%,var(--bg2))}
.toast.info{border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:color-mix(in srgb,var(--accent) 15%,var(--bg2))}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}

.link-box{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:11px;font-family:monospace;word-break:break-all;color:var(--muted);max-height:80px;overflow-y:auto}

/* ===== PRINT TEMPLATE BASE ===== */
.print-area{display:none;--p-accent:#333;--p-accent-soft:#f3f4f6;--p-text:#111;--p-muted:#555;--p-border:#d1d5db;--p-radius:0px;--p-header-style:solid}
.print-area.tpl-simple{--p-accent:#333;--p-accent-soft:#f3f4f6;--p-radius:0px}
.print-area.tpl-colorful{--p-accent:#8b5cf6;--p-accent-soft:#ede9fe;--p-radius:8px}
.print-area.tpl-official{--p-accent:#1e3a8a;--p-accent-soft:#f1f5f9;--p-radius:4px}
.print-area.tpl-modern{--p-accent:#14b8a6;--p-accent-soft:#f0fdfa;--p-radius:14px}

@media print {
  @page { size: A4; margin: 12mm 10mm; }
  html,body{background:#fff!important;color:#000!important;padding:0!important;margin:0!important;min-height:auto!important}
  body::before{display:none!important}
  .print-area{font-family:'Vazirmatn',sans-serif;direction:rtl;color:var(--p-text);background:#fff}
  .print-area *{color:inherit}

  .p-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--p-accent);padding-bottom:14px;margin-bottom:18px;gap:20px}
  .print-area.tpl-colorful .p-header,.print-area.tpl-modern .p-header{background:var(--p-accent-soft);padding:14px;border-bottom:3px solid var(--p-accent);border-radius:var(--p-radius)}
  .print-area.tpl-official .p-header{border-bottom:4px double var(--p-accent)}
  .print-area.tpl-modern .p-header{border-right:6px solid var(--p-accent);border-bottom:1px solid var(--p-border);border-radius:0 var(--p-radius) var(--p-radius) 0}

  .p-seller{display:flex;gap:14px;align-items:flex-start}
  .p-logo{width:70px;height:70px;border-radius:var(--p-radius);background:#f3f4f6;display:grid;place-items:center;font-size:32px;overflow:hidden;flex-shrink:0}
  .p-logo img{width:100%;height:100%;object-fit:cover}
  .p-seller-info h1{font-size:20px;margin-bottom:6px;color:var(--p-accent)}
  .p-seller-info div{font-size:11px;line-height:1.6}
  .p-invoice-meta{text-align:left;flex-shrink:0}
  .p-invoice-meta h2{font-size:24px;margin-bottom:8px;letter-spacing:1px;color:var(--p-accent)}
  .p-invoice-meta .p-meta-row{font-size:11px;line-height:1.8}
  .p-invoice-meta .p-meta-row b{display:inline-block;min-width:70px}

  .p-buyer-box{background:var(--p-accent-soft);border:1px solid var(--p-border);border-radius:var(--p-radius);padding:12px;margin-bottom:16px}
  .p-buyer-box h3{font-size:13px;margin-bottom:6px;color:var(--p-accent)}
  .p-buyer-box div{font-size:11px;line-height:1.6}

  .p-table{width:100%;border-collapse:collapse;margin-bottom:16px;border-radius:var(--p-radius);overflow:hidden}
  .p-table th{background:var(--p-accent);color:#fff!important;padding:9px 8px;font-size:11px;text-align:right;border:1px solid var(--p-accent);font-weight:700}
  .print-area.tpl-simple .p-table th{background:#374151;color:#fff!important}
  .p-table td{padding:9px 8px;font-size:11px;text-align:right;border:1px solid var(--p-border)}
  .p-table td.num{text-align:center;font-family:monospace}
  .p-table tbody tr:nth-child(even){background:var(--p-accent-soft)}

  .p-totals{margin-left:auto;width:55%;border:1px solid var(--p-border);border-radius:var(--p-radius);overflow:hidden}
  .p-totals-row{display:flex;justify-content:space-between;padding:9px 12px;font-size:11px;border-bottom:1px solid var(--p-accent-soft)}
  .p-totals-row:last-child{background:var(--p-accent-soft);font-size:14px;font-weight:800;border-bottom:none;padding:12px;color:var(--p-accent)}

  .p-notes{margin-top:16px;padding:12px;background:var(--p-accent-soft);border-radius:var(--p-radius);font-size:11px;line-height:1.7;border-right:3px solid var(--p-accent)}
  .p-footer{margin-top:30px;display:flex;justify-content:space-between;font-size:10px;color:var(--p-muted)!important;padding-top:14px;border-top:1px solid var(--p-border)}
  .p-signature{margin-top:30px;text-align:left;font-size:11px}
  .p-signature .p-sig-line{width:180px;border-top:1px solid var(--p-accent);margin-top:40px;padding-top:4px;text-align:center}

}

/* Progress bar for payments */
.goal-bar{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.goal-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s;border-radius:6px}
.goal-fill.done{background:linear-gradient(90deg,var(--success),#22c55e)}

/* Overdue badge */
.ic-status.overdue{background:color-mix(in srgb,var(--danger) 25%,transparent);color:var(--danger);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.alert-card{padding:14px;border-radius:16px;background:color-mix(in srgb,var(--danger) 12%,transparent);border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);margin-bottom:12px;display:flex;gap:12px;align-items:center}
.alert-card .ac-icon{font-size:28px;flex-shrink:0}
.alert-card .ac-body{flex:1}
.alert-card .ac-title{font-size:14px;font-weight:800;color:var(--danger);margin-bottom:4px}
.alert-card .ac-desc{font-size:11px;color:var(--muted)}
.alert-card.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.alert-card.warn .ac-title{color:var(--warn)}
</style>
<script>
window._dbgErrors = [];
window._showDbg = function() {
  if (!window._dbgErrors.length) return;
  var el = document.getElementById('_dbg');
  if (!el) {
    el = document.createElement('pre');
    el.id = '_dbg';
    el.style.cssText = 'position:fixed;inset:0;background:#000;color:#f00;padding:14px;font-size:11px;white-space:pre-wrap;direction:ltr;text-align:left;z-index:99999;overflow:auto;margin:0;line-height:1.4';
    document.body.appendChild(el);
  }
  el.textContent = window._dbgErrors.join('\n\n---\n\n');
};
window.addEventListener('error', function(e) {
  window._dbgErrors.push('JS ERROR: ' + (e.message||'?') + '\n' + (e.filename||'') + ':' + (e.lineno||'') + ':' + (e.colno||'') + '\n' + ((e.error && e.error.stack) || ''));
  window._showDbg();
});
window.addEventListener('unhandledrejection', function(e) {
  window._dbgErrors.push('PROMISE: ' + ((e.reason && e.reason.message) || e.reason) + '\n' + ((e.reason && e.reason.stack) || ''));
  window._showDbg();
});
</script>

<script type="module">
import { createApp, reactive, ref, computed, onMounted, nextTick } from 'vue';

const faDigits = s => String(s).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const newId = () => (crypto?.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
const todayKey = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const formatMoney = n => faDigits(Math.round(Number(n) || 0).toLocaleString('en-US'));
const persianDate = (iso) => {
  try { return new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: 'long', day: 'numeric' }).format(iso ? new Date(iso) : new Date()); }
  catch { return ''; }
};
const persianYearMonth = (iso) => {
  try {
    const d = iso ? new Date(iso) : new Date();
    const parts = new Intl.DateTimeFormat('en-US-u-ca-persian', { year: 'numeric', month: 'numeric' }).formatToParts(d);
    const r = {}; parts.forEach(p => r[p.type] = p.value);
    return { year: parseInt(r.year), month: parseInt(r.month) };
  } catch { return { year: 0, month: 0 }; }
};
const DB = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('inv_' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('inv_' + k, JSON.stringify(v)); return true; } catch { return false; } },
  remove(k) { try { localStorage.removeItem('inv_' + k); } catch {} }
};

/* ===== Share helpers ===== */
function slimInvoice(inv) {
  return {
    n: inv.number, d: inv.issueDate, dd: inv.dueDate, s: inv.status,
    se: { n: inv.seller.name, p: inv.seller.phone, e: inv.seller.email, a: inv.seller.address, t: inv.seller.taxId },
    b: { n: inv.buyer.name, p: inv.buyer.phone, e: inv.buyer.email, a: inv.buyer.address, t: inv.buyer.taxId },
    i: (inv.items || []).map(x => ({ d: x.desc, q: x.qty, u: x.unitPrice, dc: x.discount })),
    t: inv.taxRate, id: inv.invoiceDiscount || 0, nt: inv.notes, c: inv.currency
  };
}
function expandInvoice(slim) {
  return {
    id: null,
    number: slim.n || 'INV',
    issueDate: slim.d || todayKey(),
    dueDate: slim.dd || todayKey(),
    status: slim.s || 'pending',
    seller: { name: slim.se?.n || '', phone: slim.se?.p || '', email: slim.se?.e || '', address: slim.se?.a || '', taxId: slim.se?.t || '', logo: null },
    buyer: { name: slim.b?.n || '', phone: slim.b?.p || '', email: slim.b?.e || '', address: slim.b?.a || '', taxId: slim.b?.t || '' },
    items: (slim.i || []).map(x => ({ id: newId(), desc: x.d || '', qty: x.q || 0, unitPrice: x.u || 0, discount: x.dc || 0 })),
    taxRate: slim.t || 0,
    invoiceDiscount: slim.id || 0,
    notes: slim.nt || '',
    currency: slim.c || 'toman'
  };
}
function encodeShareLink(inv) {
  const slim = slimInvoice(inv);
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(slim))));
  return location.origin + location.pathname + '#share=' + b64;
}
function decodeShareLink(hash) {
  const b64 = decodeURIComponent(hash.slice(7));
  return expandInvoice(JSON.parse(decodeURIComponent(escape(atob(b64)))));
}

/* ===== Toast ===== */
const toast = {
  items: reactive([]),
  show(msg, type = 'info', duration = 3000) {
    const id = Date.now() + Math.random();
    const icons = { success: '✅', error: '❌', info: 'ℹ️' };
    this.items.push({ id, msg: icons[type] + ' ' + msg, type });
    setTimeout(() => this.remove(id), duration);
  },
  success(m) { this.show(m, 'success'); },
  error(m) { this.show(m, 'error'); },
  info(m) { this.show(m, 'info'); },
  remove(id) { const i = this.items.findIndex(x => x.id === id); if (i > -1) this.items.splice(i, 1); }
};

const store = reactive({
  seller: DB.get('seller', { name: '', phone: '', email: '', address: '', taxId: '', logo: null }),
  buyers: DB.get('buyers', []),
  invoices: DB.get('invoices', []),
  itemTemplates: DB.get('itemTemplates', []),
  discountCodes: DB.get('discountCodes', []),
  settings: { ...DEFAULT_SETTINGS, ...DB.get('settings', {}) },
  draft: null,

  save() {
    DB.set('seller', this.seller);
    DB.set('buyers', this.buyers);
    DB.set('invoices', this.invoices);
    DB.set('itemTemplates', this.itemTemplates);
    DB.set('discountCodes', this.discountCodes);
    DB.set('settings', this.settings);
  },
  applyTheme() {
    document.documentElement.setAttribute('data-theme', this.settings.theme || 'dark');
    document.documentElement.setAttribute('data-accent', this.settings.accent || 'purple');
  },
  toggleTheme() {
    this.settings.theme = this.settings.theme === 'dark' ? 'light' : 'dark';
    this.save(); this.applyTheme();
  },
  generateInvoiceNumber() {
    const yy = persianYearMonth().year;
    const n = String(this.settings.nextNumber || 1).padStart(4, '0');
    return `${this.settings.numberPrefix || 'INV'}-${yy}-${n}`;
  },
  createDraft() {
    const due = new Date(); due.setDate(due.getDate() + 7);
    this.draft = {
      id: null,
      number: this.generateInvoiceNumber(),
      issueDate: todayKey(),
      dueDate: due.toISOString().slice(0, 10),
      status: 'pending',
      seller: JSON.parse(JSON.stringify(this.seller)),
      buyer: { name: '', phone: '', email: '', address: '', taxId: '' },
      items: [{ id: newId(), desc: '', qty: 1, unitPrice: 0, discount: 0 }],
      taxRate: this.settings.autoTax ? this.settings.taxRate : 0,
      invoiceDiscount: 0,
      discountCode: '',
      discountCodeAmount: 0,
      notes: this.settings.defaultNotes,
      currency: this.settings.currency,
      template: this.settings.defaultTemplate || 'colorful'
    };
  },
  loadDraft(invoice) { this.draft = JSON.parse(JSON.stringify(invoice)); if (!this.draft.template) this.draft.template = 'colorful'; if (this.draft.invoiceDiscount === undefined) this.draft.invoiceDiscount = 0; },
  saveDraft() {
    if (!this.draft) return false;
    const d = this.draft;
    if (!d.buyer.name?.trim()) { toast.error('نام خریدار الزامی است'); return false; }
    if (!d.items.some(i => i.desc?.trim() || i.qty > 0)) { toast.error('حداقل یک آیتم لازم است'); return false; }
    const cleanItems = d.items.filter(i => i.desc?.trim() || i.qty > 0 || i.unitPrice > 0);
    const record = { ...d, items: cleanItems, updatedAt: new Date().toISOString() };
    const idx = this.invoices.findIndex(x => x.id === d.id);
    if (idx > -1) this.invoices[idx] = record;
    else {
      record.id = newId();
      record.createdAt = new Date().toISOString();
      this.invoices.unshift(record);
      this.settings.nextNumber = (this.settings.nextNumber || 1) + 1;
      this.draft.id = record.id;
      this.draft.createdAt = record.createdAt;
      if (record.discountCode) this.bumpDiscountCodeUsage(record.discountCode);
    }
    const exBuyer = this.buyers.find(b => b.name.trim() === d.buyer.name.trim() && b.phone === d.buyer.phone);
    if (!exBuyer && d.buyer.name.trim()) this.buyers.unshift({ id: newId(), ...d.buyer });
    this.save();
    return true;
  },
  deleteInvoice(id) { this.invoices = this.invoices.filter(x => x.id !== id); this.save(); },
  duplicateInvoice(id) {
    const orig = this.invoices.find(x => x.id === id);
    if (!orig) return;
    const copy = JSON.parse(JSON.stringify(orig));
    copy.id = null;
    copy.number = this.generateInvoiceNumber();
    copy.issueDate = todayKey();
    copy.status = 'pending';
    copy.items = copy.items.map(i => ({ ...i, id: newId() }));
    this.loadDraft(copy);
  },
  addItemTemplate(t) {
    if (!t || !t.name || !t.name.trim()) return false;
    this.itemTemplates.push({
      id: newId(),
      name: t.name.trim(),
      unitPrice: Number(t.unitPrice) || 0,
      unit: (t.unit || 'عدد').trim(),
      category: (t.category || '').trim(),
      description: (t.description || '').trim()
    });
    this.save();
    return true;
  },
  updateItemTemplate(t) {
    if (!t || !t.id) return false;
    const idx = this.itemTemplates.findIndex(x => x.id === t.id);
    if (idx === -1) return false;
    this.itemTemplates[idx] = { ...this.itemTemplates[idx], ...t };
    this.save();
    return true;
  },
  deleteItemTemplate(id) {
    this.itemTemplates = this.itemTemplates.filter(x => x.id !== id);
    this.save();
  },
  addDiscountCode(cd) {
    if (!cd || !cd.code || !cd.code.trim()) return { error: 'کد الزامی است' };
    const code = cd.code.trim().toUpperCase();
    if (this.discountCodes.some(x => x.code === code)) return { error: 'این کد قبلاً وجود دارد' };
    this.discountCodes.push({
      id: newId(), code,
      type: cd.type === 'fixed' ? 'fixed' : 'percent',
      value: Number(cd.value) || 0,
      minAmount: Number(cd.minAmount) || 0,
      maxUses: Number(cd.maxUses) || 0,
      usedCount: 0,
      expiresAt: cd.expiresAt || '',
      active: cd.active !== false,
      note: (cd.note || '').trim()
    });
    this.save();
    return true;
  },
  updateDiscountCode(cd) {
    if (!cd || !cd.id) return { error: 'نامعتبر' };
    const idx = this.discountCodes.findIndex(x => x.id === cd.id);
    if (idx === -1) return { error: 'پیدا نشد' };
    const code = (cd.code || '').trim().toUpperCase();
    if (!code) return { error: 'کد الزامی است' };
    if (this.discountCodes.some((x, i) => i !== idx && x.code === code)) return { error: 'کد تکراری' };
    this.discountCodes[idx] = { ...this.discountCodes[idx], ...cd, code };
    this.save();
    return true;
  },
  deleteDiscountCode(id) {
    this.discountCodes = this.discountCodes.filter(x => x.id !== id);
    this.save();
  },
  findDiscountCode(code) {
    if (!code) return null;
    const k = String(code).trim().toUpperCase();
    return this.discountCodes.find(x => x.code === k) || null;
  },
  validateDiscountCode(code, subtotal) {
    const cd = this.findDiscountCode(code);
    if (!cd) return { ok: false, error: 'کد پیدا نشد' };
    if (!cd.active) return { ok: false, error: 'این کد غیرفعال شده' };
    if (cd.expiresAt && cd.expiresAt < todayKey()) return { ok: false, error: 'کد منقضی شده' };
    if (cd.maxUses > 0 && cd.usedCount >= cd.maxUses) return { ok: false, error: 'ظرفیت استفاده این کد پر شده' };
    if (cd.minAmount > 0 && subtotal < cd.minAmount) return { ok: false, error: 'حداقل مبلغ برای این کد ' + Math.round(cd.minAmount).toLocaleString('en-US') + ' است' };
    const amount = cd.type === 'percent' ? subtotal * (cd.value / 100) : Math.min(cd.value, subtotal);
    return { ok: true, code: cd.code, type: cd.type, value: cd.value, amount };
  },
  bumpDiscountCodeUsage(code) {
    const cd = this.findDiscountCode(code);
    if (cd) { cd.usedCount = (cd.usedCount || 0) + 1; this.save(); }
  },
  findBuyer(name) {
    if (!name) return null;
    return this.buyers.find(b => b.name.trim() === name.trim()) || null;
  },
  upsertBuyer(buyer) {
    if (!buyer || !buyer.name || !buyer.name.trim()) return false;
    const idx = this.buyers.findIndex(b => b.name.trim() === buyer.name.trim() && (b.phone || '') === (buyer.phone || ''));
    if (idx > -1) this.buyers[idx] = { ...this.buyers[idx], ...buyer };
    else this.buyers.unshift({ id: newId(), ...buyer });
    this.save();
    return true;
  },
  renameBuyerInInvoices(oldName, newBuyer) {
    this.invoices.forEach(inv => {
      if ((inv.buyer.name || '').trim() === oldName.trim()) inv.buyer = { ...inv.buyer, ...newBuyer };
    });
    this.save();
  },
  getDaysOverdue(inv) {
    if (!inv.dueDate || inv.status !== 'pending') return 0;
    const due = new Date(inv.dueDate);
    const today = new Date(todayKey());
    if (isNaN(due.getTime())) return 0;
    const diff = Math.floor((today - due) / 86400000);
    return diff > 0 ? diff : 0;
  },
  getOverdueInvoices() {
    return this.invoices.filter(inv => this.getDaysOverdue(inv) > 0);
  },
  getDueSoonInvoices() {
    return this.invoices.filter(inv => {
      if (inv.status !== 'pending' || !inv.dueDate) return false;
      const due = new Date(inv.dueDate);
      const today = new Date(todayKey());
      if (isNaN(due.getTime())) return false;
      const diff = Math.floor((due - today) / 86400000);
      return diff >= 0 && diff <= 3;
    });
  },
  getPaid(inv) {
    const list = Array.isArray(inv.payments) ? inv.payments : [];
    return list.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  },
  getRemaining(inv) {
    const total = this.calculateTotals(inv).grandTotal;
    return Math.max(0, total - this.getPaid(inv));
  },
  addPayment(invoiceId, payment) {
    const inv = this.invoices.find(x => x.id === invoiceId);
    if (!inv) return false;
    if (!Array.isArray(inv.payments)) inv.payments = [];
    inv.payments.push({
      id: newId(),
      date: payment.date || todayKey(),
      amount: Number(payment.amount) || 0,
      method: payment.method || 'cash',
      note: payment.note || ''
    });
    const remaining = this.getRemaining(inv);
    if (remaining <= 0) inv.status = 'paid';
    this.save();
    return true;
  },
  deletePayment(invoiceId, paymentId) {
    const inv = this.invoices.find(x => x.id === invoiceId);
    if (!inv || !Array.isArray(inv.payments)) return false;
    inv.payments = inv.payments.filter(p => p.id !== paymentId);
    if (inv.status === 'paid' && this.getRemaining(inv) > 0) inv.status = 'pending';
    this.save();
    return true;
  },
  calculateTotals(inv) {
    const items = (inv.items || []).map(i => {
      const qty = Number(i.qty) || 0;
      const price = Number(i.unitPrice) || 0;
      const disc = Number(i.discount) || 0;
      const base = qty * price;
      const discount = base * (disc / 100);
      return { ...i, base, discount, total: base - discount };
    });
    const subtotal = items.reduce((s, i) => s + i.base, 0);
    const discountTotal = items.reduce((s, i) => s + i.discount, 0);
    const afterItems = subtotal - discountTotal;
    const invDiscPct = Number(inv.invoiceDiscount) || 0;
    const invoiceDiscount = afterItems * (invDiscPct / 100);
    const afterAll = afterItems - invoiceDiscount;
    const codeAmount = Math.min(Number(inv.discountCodeAmount) || 0, afterAll);
    const afterCode = afterAll - codeAmount;
    const tax = afterCode * ((Number(inv.taxRate) || 0) / 100);
    const grandTotal = afterCode + tax;
    return { items, subtotal, discountTotal, afterItems, invoiceDiscount, afterAll, discountCodeAmount: codeAmount, afterCode, tax, grandTotal };
  }
});

const DashboardView = {
  emits: ['navigate', 'openCustomer'],
  setup(props, { emit }) {
    const totalPaid = computed(() => store.invoices.filter(i => i.status === 'paid').reduce((s, i) => s + store.calculateTotals(i).grandTotal, 0));
    const totalPending = computed(() => store.invoices.filter(i => i.status === 'pending').reduce((s, i) => s + store.calculateTotals(i).grandTotal, 0));
    const countThisMonth = computed(() => {
      const now = persianYearMonth();
      return store.invoices.filter(i => {
        const p = persianYearMonth(i.issueDate);
        return p.year === now.year && p.month === now.month;
      }).length;
    });
    const currencySymbol = computed(() => CURRENCIES.find(c => c.id === store.settings.currency)?.symbol || 'ت');

    const last6Months = computed(() => {
      const arr = [];
      const now = new Date();
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const p = persianYearMonth(d.toISOString());
        arr.push({ year: p.year, month: p.month, total: 0 });
      }
      store.invoices.forEach(inv => {
        if (inv.status === 'canceled') return;
        const p = persianYearMonth(inv.issueDate);
        const slot = arr.find(a => a.year === p.year && a.month === p.month);
        if (slot) slot.total += store.calculateTotals(inv).grandTotal;
      });
      return arr;
    });
    const maxChart = computed(() => Math.max(1, ...last6Months.value.map(m => m.total)));
    const monthNames = ['فرو','ارد','خرد','تیر','مرد','شهر','مهر','آبا','آذر','دی','بهم','اسف'];
    const labelForMonth = (m) => monthNames[m.month - 1] || '';
    const recentInvoices = computed(() => store.invoices.slice(0, 5));
    const overdueList = computed(() => store.getOverdueInvoices());
    const overdueTotal = computed(() => overdueList.value.reduce((s, i) => s + store.getRemaining(i), 0));
    const dueSoonList = computed(() => store.getDueSoonInvoices());
    const goToInvoice = (id) => { modals.invoiceDetail = store.invoices.find(x => x.id === id); };

    return { store, modals, totalPaid, totalPending, countThisMonth, currencySymbol, last6Months, maxChart, labelForMonth, recentInvoices, goToInvoice, overdueList, overdueTotal, dueSoonList, formatMoney, persianDate, faDigits, emit };
  },
  template: `
    <div class="section-title"><span>📊</span><span>داشبورد</span></div>
    <div class="big-stats">
      <div class="big-stat"><div class="bs-icon">💰</div><div class="bs-val">{{ formatMoney(totalPaid) }} {{ currencySymbol }}</div><div class="bs-lbl">دریافت‌شده</div></div>
      <div class="big-stat"><div class="bs-icon">⏳</div><div class="bs-val">{{ formatMoney(totalPending) }} {{ currencySymbol }}</div><div class="bs-lbl">در انتظار</div></div>
      <div class="big-stat"><div class="bs-icon">🧾</div><div class="bs-val">{{ faDigits(countThisMonth) }}</div><div class="bs-lbl">این ماه</div></div>
      <div class="big-stat"><div class="bs-icon">📋</div><div class="bs-val">{{ faDigits(store.invoices.length) }}</div><div class="bs-lbl">کل فاکتورها</div></div>
    </div>
    <div v-if="overdueList.length" class="alert-card" @click="emit('navigate','invoices')" style="cursor:pointer">
      <div class="ac-icon">🔴</div>
      <div class="ac-body">
        <div class="ac-title">{{ faDigits(overdueList.length) }} فاکتور عقب‌افتاده</div>
        <div class="ac-desc">جمع باقی‌مانده: {{ formatMoney(overdueTotal) }} {{ currencySymbol }}</div>
      </div>
      <div style="font-size:20px;color:var(--muted)">‹</div>
    </div>
    <div v-if="dueSoonList.length" class="alert-card warn" @click="emit('navigate','invoices')" style="cursor:pointer">
      <div class="ac-icon">⏰</div>
      <div class="ac-body">
        <div class="ac-title">{{ faDigits(dueSoonList.length) }} فاکتور نزدیک به سررسید</div>
        <div class="ac-desc">تا ۳ روز آینده سررسید می‌شن</div>
      </div>

const CustomersView = {
  emits: ['openInvoices'],
  setup(props, { emit }) {
    const search = ref('');
    const currencySymbol = computed(() => CURRENCIES.find(c => c.id === store.settings.currency)?.symbol || 'ت');
    const customers = computed(() => {
      const map = {};
      store.invoices.forEach(inv => {
        const key = (inv.buyer.name || '—').trim();
        if (!map[key]) map[key] = { name: key, count: 0, total: 0, paid: 0, pending: 0, lastDate: null, invoices: [] };
        const t = store.calculateTotals(inv).grandTotal;
        map[key].count++;
        if (inv.status === 'paid') map[key].paid += t;
        else if (inv.status === 'pending') { map[key].pending += t; map[key].total += t; }
        else if (inv.status !== 'canceled') map[key].total += t;
        map[key].invoices.push(inv);
        if (!map[key].lastDate || inv.issueDate > map[key].lastDate) map[key].lastDate = inv.issueDate;
      });
      let arr = Object.values(map);
      const q = search.value.trim().toLowerCase();
      if (q) arr = arr.filter(c => c.name.toLowerCase().includes(q));
      return arr.sort((a, b) => b.total - a.total);
    });
    const initial = (name) => (name || '?').trim().charAt(0);
    const viewCustomer = (c) => { modals.customerDetail = c.name; };
    return { store, modals, search, customers, currencySymbol, initial, formatMoney, persianDate, faDigits, viewCustomer };
  },
  template: `

const InvoiceForm = {
  emits: ['saved', 'canceled'],
  setup(props, { emit }) {
    if (!store.draft) store.createDraft();
    const draft = computed(() => store.draft);
    const totals = computed(() => store.calculateTotals(store.draft));
    const codeInput = ref('');
    const codeError = ref('');
    const codeApplied = computed(() => !!(store.draft?.discountCode));

    const applyDiscountCode = () => {
      codeError.value = '';
      const k = codeInput.value.trim().toUpperCase();
      if (!k) { codeError.value = 'کد را وارد کن'; return; }
      if (!store.draft) return;
      const subtotalAfterInv = store.calculateTotals({ ...store.draft, discountCodeAmount: 0 }).afterAll;
      const res = store.validateDiscountCode(k, subtotalAfterInv);
      if (!res.ok) { codeError.value = res.error; return; }
      store.draft.discountCode = res.code;
      store.draft.discountCodeAmount = res.amount;
      codeInput.value = '';
      toast.success('کد «' + res.code + '» اعمال شد');
    };

    const removeDiscountCode = () => {
      if (!store.draft) return;
      store.draft.discountCode = '';
      store.draft.discountCodeAmount = 0;
      codeError.value = '';
      codeInput.value = '';
      toast.info('کد حذف شد');
    };
    const addItem = () => store.draft.items.push({ id: newId(), desc: '', qty: 1, unitPrice: 0, discount: 0 });
    const removeItem = (id) => {
      if (store.draft.items.length <= 1) { toast.error('حداقل یک آیتم لازم است'); return; }
      store.draft.items = store.draft.items.filter(i => i.id !== id);
    };
    const updateItemTotal = (item) => {
      const base = (Number(item.qty) || 0) * (Number(item.unitPrice) || 0);
      const disc = base * ((Number(item.discount) || 0) / 100);
      return base - disc;
    };
    const save = () => { if (store.saveDraft()) { toast.success('فاکتور ذخیره شد'); emit('saved'); } };
    const print = () => {
      if (!store.draft.buyer.name?.trim()) { toast.error('نام خریدار الزامی است'); return; }
      if (!store.saveDraft()) return;
      toast.success('ذخیره شد — در حال آماده‌سازی چاپ');
      nextTick(() => setTimeout(() => window._printInvoice(), 400));
    };
    const pickBuyer = () => { modals.buyerPicker = true; };
    const cancelForm = () => { if (confirm('از فاکتور فعلی صرف‌نظر می‌کنی؟')) { store.draft = null; emit('canceled'); } };
    const currencySymbol = computed(() => CURRENCIES.find(c => c.id === store.draft.currency)?.symbol || 'ت');
    return { store, modals, draft, totals, addItem, removeItem, updateItemTotal, save, print, pickBuyer, cancelForm, formatMoney, faDigits, currencySymbol, CURRENCIES, TEMPLATES, codeInput, codeError, codeApplied, applyDiscountCode, removeDiscountCode };

const InvoiceListView = {
  props: { customerFilter: { type: String, default: '' } },
  emits: ['edit', 'clearCustomer'],
  setup(props, { emit }) {
    const search = ref('');
    const statusFilter = ref('all');
    const dateFilter = ref('all');
    const currencySymbol = computed(() => CURRENCIES.find(c => c.id === store.settings.currency)?.symbol || 'ت');

    const inDateRange = (iso) => {
      if (dateFilter.value === 'all') return true;
      const p = persianYearMonth(iso);
      const now = persianYearMonth();
      if (dateFilter.value === 'this-month') return p.year === now.year && p.month === now.month;
      if (dateFilter.value === 'last-month') {
        let m = now.month - 1, y = now.year;
        if (m < 1) { m = 12; y--; }
        return p.year === y && p.month === m;
      }
      if (dateFilter.value === '3-months') {
        const monthsAgo = (now.year * 12 + now.month) - (p.year * 12 + p.month);
        return monthsAgo >= 0 && monthsAgo <= 2;
      }
      if (dateFilter.value === 'this-year') return p.year === now.year;
      return true;
    };

    const filtered = computed(() => {
      let arr = store.invoices;
      if (props.customerFilter) arr = arr.filter(i => (i.buyer.name || '—').trim() === props.customerFilter);
      if (statusFilter.value !== 'all') arr = arr.filter(i => i.status === statusFilter.value);
      arr = arr.filter(i => inDateRange(i.issueDate));
      const q = search.value.trim().toLowerCase();
      if (q) arr = arr.filter(i => i.number.toLowerCase().includes(q) || i.buyer.name.toLowerCase().includes(q));
      return arr;
    });

    const totalFiltered = computed(() => filtered.value.filter(i => i.status !== 'canceled').reduce((s, i) => s + store.calculateTotals(i).grandTotal, 0));
    const getPaid = (inv) => store.getPaid(inv);
    const getRemaining = (inv) => store.getRemaining(inv);

    const openDetail = (inv) => { modals.invoiceDetail = inv; };
    const editInvoice = (inv) => { store.loadDraft(inv); emit('edit'); };
    const clearCustomer = () => emit('clearCustomer');

    return { store, modals, search, statusFilter, dateFilter, filtered, totalFiltered, currencySymbol, openDetail, editInvoice, clearCustomer, getPaid, getRemaining, formatMoney, persianDate, faDigits };
  },

/* ===== Canvas invoice image ===== */
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

async function invoiceToBlob(inv) {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch {}
  const totals = store.calculateTotals(inv);
  const dpr = 2, W = 720, PAD = 32;
  const items = totals.items.length ? totals.items : [{ desc: '—', qty: 0, unitPrice: 0, discount: 0, total: 0 }];
  const rowH = 46;
  const headerH = 160;
  const buyerH = 100;
  const tableH = 40 + items.length * rowH;
  const totalsH = 180;
  const notesH = inv.notes ? 90 : 0;
  const H = headerH + 24 + buyerH + 24 + tableH + 24 + totalsH + (notesH ? 24 + notesH : 0) + 60;

  const c = document.createElement('canvas');
  c.width = W * dpr;
  c.height = H * dpr;
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.direction = 'rtl';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';

  const acc = ACCENTS.find(a => a.id === store.settings.accent) || ACCENTS[0];
  const sym = CURRENCIES.find(x => x.id === inv.currency)?.symbol || 'ت';

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  const grad = ctx.createLinearGradient(0, 0, W, headerH);
  grad.addColorStop(0, acc.c1); grad.addColorStop(1, acc.c2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, headerH);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 24px Vazirmatn, sans-serif';
  ctx.fillText(inv.seller.name || 'کسب‌وکار', W - PAD, 45);
  ctx.font = '13px Vazirmatn, sans-serif';
  ctx.globalAlpha = 0.9;
  let sy = 78;
  if (inv.seller.phone) { ctx.fillText('📞 ' + faDigits(inv.seller.phone), W - PAD, sy); sy += 22; }
  if (inv.seller.email) { ctx.fillText('✉️ ' + inv.seller.email, W - PAD, sy); sy += 22; }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'left';
  ctx.font = 'bold 22px Vazirmatn, sans-serif';
  ctx.fillText('فاکتور فروش', PAD, 40);
  ctx.font = '12px Vazirmatn, sans-serif';
  ctx.globalAlpha = 0.9;
  ctx.fillText('شماره: ' + inv.number, PAD, 72);
  ctx.fillText('تاریخ: ' + persianDate(inv.issueDate), PAD, 92);
  if (inv.dueDate) ctx.fillText('سررسید: ' + persianDate(inv.dueDate), PAD, 112);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'right';

  let y = headerH + 24;

  ctx.fillStyle = '#f8fafc';
  roundRect(ctx, PAD, y, W - PAD * 2, buyerH, 12); ctx.fill();
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#64748b'; ctx.font = 'bold 11px Vazirmatn, sans-serif';
  ctx.fillText('خریدار:', W - PAD - 14, y + 22);
  ctx.fillStyle = '#0f172a'; ctx.font = 'bold 16px Vazirmatn, sans-serif';
  ctx.fillText(inv.buyer.name || '—', W - PAD - 14, y + 48);
  ctx.font = '11px Vazirmatn, sans-serif'; ctx.fillStyle = '#475569';
  let by = y + 72;
  if (inv.buyer.phone) { ctx.fillText('تلفن: ' + faDigits(inv.buyer.phone), W - PAD - 14, by); by += 18; }
  if (inv.buyer.address) ctx.fillText('آدرس: ' + inv.buyer.address.slice(0, 60), W - PAD - 14, by);

  y += buyerH + 24;

  const tableX = PAD, tableW = W - PAD * 2;
  const widths = [40, tableW - (40 + 70 + 100 + 60 + 110), 70, 100, 60, 110];
  const colCenterX = [];
  let cur = W - PAD;
  widths.forEach(w => { colCenterX.push(cur - w / 2); cur -= w; });

  ctx.fillStyle = acc.c1;
  ctx.fillRect(tableX, y, tableW, 40);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px Vazirmatn, sans-serif';
  ctx.textAlign = 'center';
  const hy = y + 20;
  ctx.fillText('#', colCenterX[0], hy);
  ctx.fillText('شرح کالا / خدمت', colCenterX[1], hy);
  ctx.fillText('تعداد', colCenterX[2], hy);
  ctx.fillText('قیمت واحد', colCenterX[3], hy);
  ctx.fillText('تخفیف', colCenterX[4], hy);
  ctx.fillText('جمع', colCenterX[5], hy);
  y += 40;

  items.forEach((item, i) => {
    if (i % 2 === 1) { ctx.fillStyle = '#f8fafc'; ctx.fillRect(tableX, y, tableW, rowH); }
    ctx.fillStyle = '#0f172a';
    ctx.font = '13px Vazirmatn, sans-serif';
    const ry = y + rowH / 2;
    ctx.textAlign = 'center';
    ctx.fillText(faDigits(i + 1), colCenterX[0], ry);
    ctx.textAlign = 'right';
    const desc = item.desc || '—';
    const trunc = desc.length > 42 ? desc.slice(0, 42) + '…' : desc;
    ctx.fillText(trunc, W - PAD - widths[0] - 8, ry);
    ctx.textAlign = 'center';
    ctx.fillText(faDigits(item.qty), colCenterX[2], ry);
    ctx.fillText(formatMoney(item.unitPrice), colCenterX[3], ry);
    ctx.fillText(item.discount ? faDigits(item.discount) + '٪' : '—', colCenterX[4], ry);
    ctx.font = 'bold 13px Vazirmatn, sans-serif';
    ctx.fillText(formatMoney(item.total), colCenterX[5], ry);
    y += rowH;
  });

  ctx.strokeStyle = '#e2e8f0';
  ctx.strokeRect(tableX, y - 40 - items.length * rowH, tableW, 40 + items.length * rowH);

  y += 24;

  const totW = 340, totX = PAD, totH = 160;
  ctx.fillStyle = '#f8fafc';
  roundRect(ctx, totX, y, totW, totH, 12); ctx.fill();
  ctx.strokeStyle = '#e2e8f0'; ctx.stroke();

  const rows = [['جمع کل', formatMoney(totals.subtotal) + ' ' + sym]];
  if (totals.discountTotal > 0) rows.push(['تخفیف آیتم‌ها', '− ' + formatMoney(totals.discountTotal) + ' ' + sym]);
  if (totals.invoiceDiscount > 0) rows.push(['تخفیف کل', '− ' + formatMoney(totals.invoiceDiscount) + ' ' + sym]);
  if (totals.tax > 0) rows.push(['مالیات (' + faDigits(inv.taxRate) + '٪)', formatMoney(totals.tax) + ' ' + sym]);
  rows.push(['مبلغ نهایی', formatMoney(totals.grandTotal) + ' ' + sym]);

  let ry2 = y + 24;
  rows.forEach((r, i) => {
    const isLast = i === rows.length - 1;
    ctx.font = isLast ? 'bold 16px Vazirmatn, sans-serif' : '13px Vazirmatn, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = isLast ? acc.c1 : '#475569';
    ctx.fillText(r[0], totX + totW - 14, ry2);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#0f172a';
    ctx.fillText(r[1], totX + 14, ry2);
    ry2 += isLast ? 32 : 24;
    if (i === rows.length - 2) {
      ctx.strokeStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.moveTo(totX + 14, ry2 - 12); ctx.lineTo(totX + totW - 14, ry2 - 12);
      ctx.stroke();
    }
  });

  y += totH + 24;

  if (inv.notes) {
    ctx.fillStyle = '#f8fafc';
    roundRect(ctx, PAD, y, W - PAD * 2, 70, 10); ctx.fill();
    ctx.fillStyle = '#475569';
    ctx.font = '12px Vazirmatn, sans-serif';
    ctx.textAlign = 'right';
    const lines = inv.notes.split('\n').slice(0, 2);
    lines.forEach((line, i) => ctx.fillText(line.slice(0, 90), W - PAD - 14, y + 26 + i * 22));
    y += 70 + 24;
  }

  ctx.fillStyle = '#94a3b8';
  ctx.font = '11px Vazirmatn, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('صادر شده با فاکتورساز', W / 2, H - 24);

  return new Promise(resolve => c.toBlob(b => resolve(b), 'image/png'));
}

const InvoiceDetailModal = {
  emits: ['edit'],
  setup(props, { emit }) {
    const inv = computed(() => modals.invoiceDetail);
    const totals = computed(() => inv.value ? store.calculateTotals(inv.value) : null);
    const currencySymbol = computed(() => CURRENCIES.find(c => c.id === (inv.value?.currency || 'toman'))?.symbol || 'ت');
    const paid = computed(() => inv.value ? store.getPaid(inv.value) : 0);
    const remaining = computed(() => inv.value && totals.value ? Math.max(0, totals.value.grandTotal - paid.value) : 0);
    const paymentsCount = computed(() => (inv.value?.payments || []).length);
    const openAddPayment = () => { modals.addPayment = inv.value.id; };
    const openPaymentsList = () => { modals.paymentsList = inv.value.id; };
    const close = () => { modals.invoiceDetail = null; };
    const edit = () => { store.loadDraft(inv.value); modals.invoiceDetail = null; emit('edit'); };
    const duplicate = () => { store.duplicateInvoice(inv.value.id); modals.invoiceDetail = null; emit('edit'); toast.info('کپی ساخته شد'); };
    const print = () => {
      store.loadDraft(inv.value);
      modals.invoiceDetail = null;
      nextTick(() => setTimeout(() => window._printInvoice(), 300));
    };
    const remove = () => { if (!confirm('این فاکتور حذف شود؟')) return; store.deleteInvoice(inv.value.id); modals.invoiceDetail = null; toast.success('حذف شد'); };
    const toggleStatus = () => { const s = ['pending', 'paid', 'canceled']; const i = s.indexOf(inv.value.status); inv.value.status = s[(i + 1) % 3]; store.save(); toast.info('وضعیت تغییر کرد'); };

    const sharing = ref(false);
    const shareImage = async () => {
      if (sharing.value) return;
      sharing.value = true;
      try {
        const blob = await invoiceToBlob(inv.value);
        const file = new File([blob], `${inv.value.number}.png`, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: inv.value.number, text: 'فاکتور ' + inv.value.number }); }
          catch (e) { if (e.name !== 'AbortError') throw e; }
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = `${inv.value.number}.png`; a.click();
          URL.revokeObjectURL(url);
          toast.success('تصویر دانلود شد');
        }
      } catch (e) { toast.error('خطا: ' + (e.message || 'نامشخص')); }
      finally { sharing.value = false; }
    };

    const shareLink = ref('');
    const genLink = () => {
      try {
        const link = encodeShareLink(inv.value);
        shareLink.value = link;
        if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => toast.success('لینک کپی شد')).catch(() => {});
        else toast.info('لینک ساخته شد');
      } catch (e) { toast.error('خطا: ' + e.message); }
    };
    const copyLink = () => {
      if (!shareLink.value) return;
      if (navigator.clipboard) navigator.clipboard.writeText(shareLink.value).then(() => toast.success('کپی شد')).catch(() => toast.error('کپی نشد'));
      else toast.info('دستی کپی کن');
    };

    return { store, modals, inv, totals, currencySymbol, paid, remaining, paymentsCount, openAddPayment, openPaymentsList, close, edit, duplicate, print, remove, toggleStatus, sharing, shareImage, shareLink, genLink, copyLink, formatMoney, persianDate, faDigits };
  },
  template: `
    <div class="modal-bg" v-if="modals.invoiceDetail" @click.self="close">
      <div class="modal" v-if="inv && totals">

const SharedInvoiceModal = {
  setup() {
    const inv = computed(() => modals.sharedInvoice);

    const currencySymbol = computed(() => CURRENCIES.find(c => c.id === (inv.value?.currency || 'toman'))?.symbol || 'ت');
    const close = () => {
      modals.sharedInvoice = null;
      if (location.hash.startsWith('#share=')) history.replaceState(null, '', location.pathname);
    };
    const print = () => {
      store.loadDraft({ ...inv.value, id: null });
      modals.sharedInvoice = null;
      nextTick(() => setTimeout(() => window._printInvoice(), 300));
    };
    const importIt = () => {
      const copy = JSON.parse(JSON.stringify(inv.value));
      copy.id = null;
      store.loadDraft(copy);
      modals.sharedInvoice = null;
      if (location.hash.startsWith('#share=')) history.replaceState(null, '', location.pathname);
      toast.success('به اپ اضافه شد — می‌تونی ویرایش کنی');
      store.draft = { ...store.draft, number: store.generateInvoiceNumber() };

    return { modals, inv, totals, currencySymbol, close, print, importIt, formatMoney, persianDate, faDigits };

const ReportsView = {
  setup() {
    const dateFrom = ref('');
    const dateTo = ref('');
    const customerFilter = ref('');
    const statusFilter = ref('all');
    const currencySymbol = computed(() => CURRENCIES.find(x => x.id === store.settings.currency)?.symbol || 'ت');

    const filtered = computed(() => {
      let arr = [...store.invoices];
      if (customerFilter.value) arr = arr.filter(i => (i.buyer.name || '').trim() === customerFilter.value);
      if (statusFilter.value !== 'all') arr = arr.filter(i => i.status === statusFilter.value);
      if (dateFrom.value) arr = arr.filter(i => i.issueDate >= dateFrom.value);
      if (dateTo.value) arr = arr.filter(i => i.issueDate <= dateTo.value);
      return arr;
    });

    const stats = computed(() => {
      let total = 0, paid = 0, pending = 0, tax = 0;
      filtered.value.forEach(i => {
        if (i.status === 'canceled') return;
        const t = store.calculateTotals(i);
        total += t.grandTotal; tax += t.tax;
        if (i.status === 'paid') paid += t.grandTotal;
        else if (i.status === 'pending') pending += t.grandTotal;
      });
      return { total, paid, pending, tax, count: filtered.value.length };
    });

    const byCustomer = computed(() => {
      const m = {};
      filtered.value.forEach(i => {
        if (i.status === 'canceled') return;
        const k = (i.buyer.name || '—').trim();
        if (!m[k]) m[k] = { name: k, count: 0, total: 0, paid: 0 };
        const t = store.calculateTotals(i).grandTotal;
        m[k].count++; m[k].total += t;
        if (i.status === 'paid') m[k].paid += t;
      });
      return Object.values(m).sort((a,b) => b.total - a.total);
    });

    const byMonth = computed(() => {
      const m = {};
      filtered.value.forEach(i => {
        if (i.status === 'canceled') return;
        const p = persianYearMonth(i.issueDate);
        const k = p.year + '-' + String(p.month).padStart(2, '0');
        if (!m[k]) m[k] = { key: k, year: p.year, month: p.month, count: 0, total: 0 };
        m[k].count++; m[k].total += store.calculateTotals(i).grandTotal;
      });
      return Object.values(m).sort((a,b) => a.key < b.key ? 1 : -1);
    });

    const monthNames = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
    const maxMonthTotal = computed(() => Math.max(1, ...byMonth.value.map(x => x.total)));

    const setQuickRange = (range) => {
      const now = new Date();
      if (range === 'this-month') {
        const d = new Date(now); d.setDate(d.getDate() - 30);
        dateFrom.value = todayKey(d); dateTo.value = todayKey();
      } else if (range === 'last-3') {
        const d = new Date(now); d.setDate(d.getDate() - 90);
        dateFrom.value = todayKey(d); dateTo.value = todayKey();
      } else if (range === 'this-year') {
        const d = new Date(now); d.setDate(d.getDate() - 365);
        dateFrom.value = todayKey(d); dateTo.value = todayKey();
      } else {
        dateFrom.value = ''; dateTo.value = '';
      }
    };

    const clearFilters = () => {
      dateFrom.value = ''; dateTo.value = '';
      customerFilter.value = ''; statusFilter.value = 'all';
    };

    const uniqueCustomers = computed(() => {
      const s = new Set();
      store.invoices.forEach(i => { if (i.buyer.name) s.add(i.buyer.name); });
      return Array.from(s).sort();
    });

    const taxYear = ref(persianYearMonth().year);
    const availableYears = computed(() => {
      const years = new Set();
      store.invoices.forEach(inv => {
        if (inv.status === 'canceled') return;
        const p = persianYearMonth(inv.issueDate);
        if (p.year) years.add(p.year);
      });
      years.add(persianYearMonth().year);
      return Array.from(years).sort((a, b) => b - a);
    });
    const setTaxYear = (y) => { taxYear.value = y; };
    const taxMonthlyData = computed(() => {
      const arr = [];
      for (let m = 1; m <= 12; m++) arr.push({ month: m, name: monthNames[m - 1], count: 0, sales: 0, tax: 0, total: 0 });
      store.invoices.forEach(inv => {
        if (inv.status === 'canceled') return;
        const p = persianYearMonth(inv.issueDate);
        if (p.year !== taxYear.value) return;
        const t = store.calculateTotals(inv);
        const slot = arr[p.month - 1];
        if (!slot) return;
        slot.count++;
        slot.sales += (t.afterCode || t.afterAll || 0);
        slot.tax += t.tax;
        slot.total += t.grandTotal;
      });
      return arr;
    });
    const taxYearTotal = computed(() => {
      let count = 0, sales = 0, tax = 0, total = 0;
      taxMonthlyData.value.forEach(m => { count += m.count; sales += m.sales; tax += m.tax; total += m.total; });
      return { count, sales, tax, total };
    });
    const exportTaxCSV = () => {
      try {
        const rows = [['ماه', 'تعداد فاکتور', 'جمع فروش (بدون مالیات)', 'مالیات', 'مبلغ کل']];
        taxMonthlyData.value.forEach(m => {
          rows.push([m.name, m.count, Math.round(m.sales), Math.round(m.tax), Math.round(m.total)]);
        });
        rows.push(['جمع سال ' + taxYear.value, taxYearTotal.value.count, Math.round(taxYearTotal.value.sales), Math.round(taxYearTotal.value.tax), Math.round(taxYearTotal.value.total)]);
        const csv = '\uFEFF' + rows.map(r => r.map(x => {
          const s = String(x ?? '');
          return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'tax-report-' + taxYear.value + '.csv'; a.click();
        URL.revokeObjectURL(url);
        toast.success('گزارش مالیاتی دانلود شد');
      } catch (e) { toast.error('خطا: ' + e.message); }
    };
    const exportCSV = () => {
      try {
        const rows = [['شماره','تاریخ صدور','سررسید','خریدار','وضعیت','تعداد آیتم','جمع کل','تخفیف','مالیات','مبلغ نهایی']];
        filtered.value.forEach(i => {
          const t = store.calculateTotals(i);
          rows.push([
            i.number, i.issueDate, i.dueDate || '', i.buyer.name,
            i.status === 'paid' ? 'پرداخت‌شده' : i.status === 'pending' ? 'در انتظار' : 'لغو',
            (i.items || []).length,
            Math.round(t.subtotal),
            Math.round(t.discountTotal + t.invoiceDiscount),
            Math.round(t.tax),
            Math.round(t.grandTotal)
          ]);
        });
        const csv = '\uFEFF' + rows.map(r => r.map(x => {
          const s = String(x ?? '');
          return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'report-' + todayKey() + '.csv'; a.click();
        URL.revokeObjectURL(url);
        toast.success('CSV دانلود شد');
      } catch (e) { toast.error('خطا: ' + e.message); }
    };

    return { store, modals, filtered, stats, byCustomer, byMonth, monthNames, maxMonthTotal, currencySymbol,
      dateFrom, dateTo, customerFilter, statusFilter, uniqueCustomers,
      setQuickRange, clearFilters, exportCSV, formatMoney, persianDate, faDigits,
      taxYear, availableYears, taxMonthlyData, taxYearTotal, exportTaxCSV, setTaxYear };
  },
  template: `
    <div class="section-title"><span>📈</span><span>گزارش پیشرفته</span></div>

    <div class="form-card">
      <div class="form-title"><span class="ft-icon">🔎</span>فیلترها</div>
      <div class="field-row">
        <div class="field"><label>از تاریخ</label><input type="date" v-model="dateFrom"></div>
        <div class="field"><label>تا تاریخ</label><input type="date" v-model="dateTo"></div>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
        <button class="btn-sm" @click="setQuickRange('this-month')">۳۰ روز</button>
        <button class="btn-sm" @click="setQuickRange('last-3')">۳ ماه</button>
        <button class="btn-sm" @click="setQuickRange('this-year')">۱ سال</button>
        <button class="btn-sm" @click="setQuickRange('all')">همه</button>
      </div>
      <div class="field-row">
        <div class="field">
          <label>مشتری</label>
          <select v-model="customerFilter">
            <option value="">همه مشتریان</option>
            <option v-for="c in uniqueCustomers" :key="c" :value="c">{{ c }}</option>
          </select>
        </div>
        <div class="field">
          <label>وضعیت</label>
          <select v-model="statusFilter">
            <option value="all">همه</option>
            <option value="paid">✅ پرداخت‌شده</option>
            <option value="pending">⏳ در انتظار</option>
            <option value="canceled">❌ لغو</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost" style="flex:1" @click="clearFilters">🔄 پاک کردن</button>
        <button class="btn btn-primary" style="flex:1" @click="exportCSV">📥 CSV</button>
      </div>
    </div>

    <div class="big-stats">
      <div class="big-stat"><div class="bs-icon">💰</div><div class="bs-val">{{ formatMoney(stats.total) }} {{ currencySymbol }}</div><div class="bs-lbl">جمع کل</div></div>
      <div class="big-stat"><div class="bs-icon">✅</div><div class="bs-val">{{ formatMoney(stats.paid) }} {{ currencySymbol }}</div><div class="bs-lbl">دریافت‌شده</div></div>
      <div class="big-stat"><div class="bs-icon">⏳</div><div class="bs-val">{{ formatMoney(stats.pending) }} {{ currencySymbol }}</div><div class="bs-lbl">در انتظار</div></div>
      <div class="big-stat"><div class="bs-icon">🏛</div><div class="bs-val">{{ formatMoney(stats.tax) }} {{ currencySymbol }}</div><div class="bs-lbl">مالیات</div></div>
    </div>

    <div v-if="stats.count === 0" class="empty"><div class="empty-icon">📊</div>داده‌ای در این بازه نیست</div>

    <template v-else>
      <div class="chart-wrap" v-if="byMonth.length">
        <div class="chart-title">📅 گزارش ماهانه ({{ faDigits(byMonth.length) }} ماه)</div>
        <div class="chart">
          <div v-for="(m, i) in byMonth.slice(0, 6).reverse()" :key="i" class="bar" :style="{ height: Math.max(3, (m.total/maxMonthTotal)*100) + '%' }">
            <div class="lbl">{{ monthNames[m.month - 1] }}</div>
          </div>
        </div>
      </div>

      <div class="section-title" style="margin-top:20px"><span>🏛</span><span>گزارش مالیاتی</span></div>

      <div class="form-card">
        <div class="form-title"><span class="ft-icon">📅</span>سال مالی (شمسی)</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
          <button v-for="y in availableYears" :key="y" class="btn-sm" :style="{background: taxYear === y ? 'var(--accent)' : '', color: taxYear === y ? '#fff' : ''}" @click="setTaxYear(y)">{{ faDigits(y) }}</button>
        </div>
        <button class="btn btn-primary btn-block" @click="exportTaxCSV">📥 خروجی CSV مالیاتی</button>
      </div>

      <div class="big-stats" v-if="taxYearTotal.count > 0">
        <div class="big-stat"><div class="bs-icon">🧾</div><div class="bs-val">{{ faDigits(taxYearTotal.count) }}</div><div class="bs-lbl">فاکتور</div></div>
        <div class="big-stat"><div class="bs-icon">💰</div><div class="bs-val">{{ formatMoney(taxYearTotal.sales) }}</div><div class="bs-lbl">فروش</div></div>
        <div class="big-stat"><div class="bs-icon">🏛</div><div class="bs-val">{{ formatMoney(taxYearTotal.tax) }}</div><div class="bs-lbl">مالیات</div></div>
        <div class="big-stat"><div class="bs-icon">📊</div><div class="bs-val">{{ formatMoney(taxYearTotal.total) }}</div><div class="bs-lbl">جمع کل</div></div>
      </div>

      <div v-if="taxYearTotal.count === 0" class="empty"><div class="empty-icon">📭</div>در سال {{ faDigits(taxYear) }} فاکتوری ثبت نشده</div>

      <div v-else class="chart-wrap">
        <div class="chart-title">📅 مالیات ماهانه سال {{ faDigits(taxYear) }}</div>
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead>
            <tr>
              <th style="padding:8px;text-align:right;font-weight:600;color:var(--muted);font-size:11px;border-bottom:1px solid var(--border)">ماه</th>
              <th style="padding:8px;text-align:center;font-weight:600;color:var(--muted);font-size:11px;border-bottom:1px solid var(--border)">تعداد</th>
              <th style="padding:8px;text-align:left;font-weight:600;color:var(--muted);font-size:11px;border-bottom:1px solid var(--border)">فروش</th>
              <th style="padding:8px;text-align:left;font-weight:600;color:var(--muted);font-size:11px;border-bottom:1px solid var(--border)">مالیات</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="m in taxMonthlyData" :key="m.month" :style="{opacity: m.count === 0 ? .35 : 1, borderBottom: '1px solid var(--border)'}">
              <td style="padding:8px;text-align:right">{{ m.name }}</td>

              <td style="padding:10px 8px;text-align:right;color:var(--accent)">جمع سال</td>
              <td style="padding:10px 8px;text-align:center;color:var(--accent)">{{ faDigits(taxYearTotal.count) }}</td>
              <td style="padding:10px 8px;text-align:left;color:var(--accent)">{{ formatMoney(taxYearTotal.sales) }}</td>
              <td style="padding:10px 8px;text-align:left;color:var(--accent)">{{ formatMoney(taxYearTotal.tax) }}</td>

      </div>

      <div v-for="c in byCustomer" :key="c.name" class="invoice-card">

const AddPaymentModal = {
  setup() {
    const amount = ref(0);
    const date = ref('');
    const method = ref('cash');
    const note = ref('');

    const inv = computed(() => {
      if (!modals.addPayment) return null;
      return store.invoices.find(x => x.id === modals.addPayment);
    });
    const totals = computed(() => inv.value ? store.calculateTotals(inv.value) : null);
    const paid = computed(() => inv.value ? store.getPaid(inv.value) : 0);
    const remaining = computed(() => inv.value && totals.value ? Math.max(0, totals.value.grandTotal - paid.value) : 0);
    const currencySymbol = computed(() => CURRENCIES.find(x => x.id === (inv.value?.currency || 'toman'))?.symbol || 'ت');

    const reset = () => {
      amount.value = 0;
      date.value = todayKey();
      method.value = 'cash';
      note.value = '';
    };

    // وقتی مودال باز می‌شه، مقدار پیش‌فرض = کل باقی‌مانده
    const init = () => {
      reset();
      if (remaining.value > 0) amount.value = Math.round(remaining.value);
    };

    const save = () => {
      if (!inv.value) return;
      if (!amount.value || amount.value <= 0) { toast.error('مبلغ باید بیشتر از صفر باشد'); return; }
      if (amount.value > remaining.value + 1) { toast.error('مبلغ بیشتر از باقی‌مانده است'); return; }
      store.addPayment(inv.value.id, { amount: amount.value, date: date.value, method: method.value, note: note.value });
      toast.success('پرداخت ثبت شد');
      if (modals.invoiceDetail) {
        modals.invoiceDetail = store.invoices.find(x => x.id === modals.invoiceDetail.id) || modals.invoiceDetail;
      }
      modals.addPayment = null;
    };

    const methods = [
      { id: 'cash', name: '💵 نقدی' },
      { id: 'card', name: '💳 کارت' },
      { id: 'transfer', name: '🏦 انتقال' },
      { id: 'crypto', name: '🪙 ارز دیجیتال' },
      { id: 'other', name: '📌 سایر' }
    ];

    return { store, modals, inv, totals, paid, remaining, currencySymbol, amount, date, method, note, methods, reset, init, save, formatMoney, faDigits };
  },
  template: `
    <div class="modal-bg" v-if="modals.addPayment && inv && totals" @click.self="modals.addPayment = null">
      <div class="modal" @vue:mounted="init">
        <h3>💳 ثبت پرداخت — {{ inv.number }}</h3>

        <div style="padding:12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--border);margin-bottom:14px">
          <div class="totals-row"><span>مبلغ فاکتور</span><b>{{ formatMoney(totals.grandTotal) }} {{ currencySymbol }}</b></div>
          <div class="totals-row"><span>پرداخت‌شده</span><b style="color:var(--success)">{{ formatMoney(paid) }} {{ currencySymbol }}</b></div>
          <div class="totals-row"><span>باقی‌مانده</span><b style="color:var(--warn)">{{ formatMoney(remaining) }} {{ currencySymbol }}</b></div>
        </div>

        <div class="field">
          <label>مبلغ پرداخت *</label>
          <input type="number" v-model.number="amount" min="0" :max="remaining" autofocus>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:10px">
          <button class="btn-sm" style="flex:1" @click="amount = Math.round(remaining / 2)">۵۰٪</button>
          <button class="btn-sm" style="flex:1" @click="amount = Math.round(remaining)">کل</button>
        </div>
        <div class="field"><label>تاریخ</label><input type="date" v-model="date"></div>
        <div class="field">
          <label>روش پرداخت</label>
          <select v-model="method">
            <option v-for="m in methods" :key="m.id" :value="m.id">{{ m.name }}</option>
          </select>
        </div>
        <div class="field"><label>یادداشت</label><input v-model="note" placeholder="اختیاری"></div>

        <div class="modal-actions">
          <button class="btn btn-ghost" @click="modals.addPayment = null">لغو</button>
          <button class="btn btn-primary" @click="save">ثبت</button>
        </div>
      </div>
    </div>
  `

const ManageDiscountsModal = {
  setup() {
    const form = reactive({ id: null, code: '', type: 'percent', value: 0, minAmount: 0, maxUses: 0, expiresAt: '', active: true, note: '' });

    const reset = () => {
      form.id = null; form.code = ''; form.type = 'percent'; form.value = 0;
      form.minAmount = 0; form.maxUses = 0; form.expiresAt = ''; form.active = true; form.note = '';
    };

    const editing = computed(() => !!form.id);

    const save = () => {
      if (!form.code.trim()) { toast.error('کد الزامی است'); return; }
      if (form.type === 'percent' && (form.value < 0 || form.value > 100)) { toast.error('درصد باید بین ۰ تا ۱۰۰ باشد'); return; }
      if (form.type === 'fixed' && form.value <= 0) { toast.error('مبلغ باید بیشتر از صفر باشد'); return; }

      let res;
      if (editing.value) res = store.updateDiscountCode({ ...form });
      else res = store.addDiscountCode({ ...form });

      if (res && res.error) { toast.error(res.error); return; }
      toast.success(editing.value ? 'بروز شد' : 'کد اضافه شد');
      reset();
    };

    const edit = (cd) => {
      form.id = cd.id; form.code = cd.code; form.type = cd.type; form.value = cd.value;
      form.minAmount = cd.minAmount || 0; form.maxUses = cd.maxUses || 0;
      form.expiresAt = cd.expiresAt || ''; form.active = cd.active !== false; form.note = cd.note || '';
    };

    const del = (id) => {
      if (!confirm('این کد حذف شود؟')) return;
      store.deleteDiscountCode(id);
      if (form.id === id) reset();
      toast.info('حذف شد');
    };

    const toggleActive = (cd) => {
      store.updateDiscountCode({ ...cd, active: !cd.active });
    };

    const close = () => { reset(); modals.manageDiscounts = false; };

    const isExpired = (cd) => cd.expiresAt && cd.expiresAt < todayKey();
    const isFull = (cd) => cd.maxUses > 0 && cd.usedCount >= cd.maxUses;

    return { store, modals, form, editing, save, edit, del, toggleActive, reset, close, isExpired, isFull, formatMoney, persianDate, faDigits };
  },
  template: `
    <div class="modal-bg" v-if="modals.manageDiscounts" @click.self="close">
      <div class="modal">
        <h3>🏷 کدهای تخفیف</h3>

        <div class="form-card" style="padding:12px;margin-bottom:12px">
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px">{{ editing ? '✏️ ویرایش کد' : '➕ کد جدید' }}</div>
          <div class="field"><label>کد *</label><input v-model="form.code" placeholder="مثلاً: WELCOME10" style="text-transform:uppercase"></div>
          <div class="field-row">
            <div class="field"><label>نوع</label>
              <select v-model="form.type">
                <option value="percent">📊 درصدی</option>
                <option value="fixed">💰 مبلغ ثابت</option>
              </select>
            </div>
            <div class="field">
              <label>{{ form.type === 'percent' ? 'درصد' : 'مبلغ' }}</label>
              <input type="number" v-model.number="form.value" min="0" :max="form.type === 'percent' ? 100 : undefined">
            </div>
          </div>
          <div class="field-row">
            <div class="field"><label>حداقل سفارش</label><input type="number" v-model.number="form.minAmount" min="0"></div>
            <div class="field"><label>حداکثر استفاده (۰=بی‌نهایت)</label><input type="number" v-model.number="form.maxUses" min="0"></div>
          </div>
          <div class="field"><label>تاریخ انقضا (خالی=بدون انقضا)</label><input type="date" v-model="form.expiresAt"></div>
          <div class="field"><label>یادداشت</label><input v-model="form.note" placeholder="اختیاری"></div>
          <div class="setting-row" style="border:none;padding:6px 0">
            <div><div class="lbl">فعال</div></div>
            <label class="switch"><input type="checkbox" v-model="form.active"><span class="slider"></span></label>
          </div>
          <div style="display:flex;gap:6px">
            <button v-if="editing" class="btn btn-ghost" style="flex:1" @click="reset">انصراف</button>
            <button class="btn btn-primary" style="flex:1" @click="save">{{ editing ? '💾 بروز' : '➕ افزودن' }}</button>
          </div>
        </div>

        <div v-if="!store.discountCodes.length" class="empty" style="padding:20px">هنوز کدی نداری</div>
        <div v-else>
          <div v-for="cd in store.discountCodes" :key="cd.id" class="invoice-card" style="padding:10px;cursor:default">
            <div class="ic-head" style="margin-bottom:6px">
              <div style="flex:1;min-width:0">
                <div class="ic-buyer" style="font-family:monospace;font-size:13px;letter-spacing:1px">{{ cd.code }}</div>
                <div style="font-size:11px;color:var(--muted);margin-top:3px">
                  {{ cd.type === 'percent' ? faDigits(cd.value) + '٪' : formatMoney(cd.value) }}
                  <span v-if="cd.minAmount > 0"> — حداقل {{ formatMoney(cd.minAmount) }}</span>
                </div>
              </div>
              <div style="text-align:left;font-size:10px">
                <span v-if="!cd.active" style="color:var(--danger)">⛔ غیرفعال</span>
                <span v-else-if="isExpired(cd)" style="color:var(--warn)">⏰ منقضی</span>
                <span v-else-if="isFull(cd)" style="color:var(--warn)">🔒 پر شده</span>
                <span v-else style="color:var(--success)">✅ فعال</span>
                <div style="color:var(--muted);margin-top:4px">
                  {{ faDigits(cd.usedCount || 0) }}<span v-if="cd.maxUses > 0"> / {{ faDigits(cd.maxUses) }}</span>
                </div>
              </div>
            </div>
            <div style="display:flex;gap:6px">

              <button class="btn-sm" style="flex:1;color:var(--danger)" @click="del(cd.id)">🗑</button>

          </div>
        </div>

        <div class="modal-actions" style="margin-top:14px"><button class="btn btn-ghost" @click="close">بستن</button></div>
      </div>
    </div>
  `
